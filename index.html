<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Work Entry</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f4f7f6; }
        .form-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px;}
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;}
        input[readonly] { background-color: #e9ecef; cursor: not-allowed; color: #666; font-weight: bold;}
        button { width: 100%; padding: 14px; background-color: #28a745; color: white; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 10px;}
        button:hover { background-color: #218838; }
        h2 { text-align: center; color: #2c3e50; margin-top: 0;}
        .flex-row { display: flex; gap: 10px; }
        .flex-item { flex: 1; }
        .small-label { display: block; font-size: 12px; color: #666; margin-top: 4px; text-align: center;}
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Driver Work Entry</h2>
        <form id="truckingForm">
            
            <div class="form-group">
                <label>Date *</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label>Week Number</label>
                <input type="number" id="weekNumber" required readonly>
            </div>

            <div class="form-group">
                <label>Driver *</label>
                <select id="driver" required>
                    <option value="">Select Driver</option>
                    <option value="Adrian">Adrian</option>
                    <option value="Aleh Zhabatsinski">Aleh Zhabatsinski</option>
                    <option value="Andrei Birau Ioan">Andrei Birau Ioan</option>
                    <option value="Andressa">Andressa</option>
                    <option value="Anton">Anton</option>
                    <option value="Bobo">Bobo</option>
                    <option value="Catalin Vaduva">Catalin Vaduva</option>
                    <option value="Cosmin Mihut">Cosmin Mihut</option>
                    <option value="Devran">Devran</option>
                    <option value="Eugeniu">Eugeniu</option>
                    <option value="Gabriel Cason">Gabriel Cason</option>
                    <option value="Gabriel Stefanoaia">Gabriel Stefanoaia</option>
                    <option value="Ionel-Alin Sergirceanu">Ionel-Alin Sergirceanu</option>
                    <option value="Ionut">Ionut</option>
                    <option value="Ionut Popo">Ionut Popo</option>
                    <option value="Karolis Kamicaitis">Karolis Kamicaitis</option>
                    <option value="Miriuta Arcadii">Miriuta Arcadii</option>
                    <option value="Slawomir">Slawomir</option>
                    <option value="Tiago Cruz">Tiago Cruz</option>
                    <option value="Virgil Vaduva">Virgil Vaduva</option>
                </select>
            </div>

            <div class="form-group">
                <label>Client *</label>
                <select id="client" required>
                    <option value="">Select Client</option>
                    <option value="Allday">Allday</option>
                    <option value="Anji">Anji</option>
                    <option value="Flow">Flow</option>
                    <option value="Gofo">Gofo</option>
                    <option value="Stef">Stef</option>
                    <option value="Wex Holland">Wex Holland</option>
                </select>
            </div>

            <div class="form-group">
                <label>Truck License</label>
                <input type="text" id="truckLicense" placeholder="e.g. 75-BLT-6">
            </div>

            <div class="form-group">
                <label>Trailer License</label>
                <input type="text" id="trailerLicense" placeholder="e.g. ON-29-FH">
            </div>

            <div class="form-group">
                <label>Start Time *</label>
                <input type="datetime-local" id="beginTime" required>
            </div>

            <div class="form-group">
                <label>End Time *</label>
                <input type="datetime-local" id="eindTime" required>
            </div>

            <div class="form-group">
                <label>Break Time</label>
                <div class="flex-row">
                    <div class="flex-item">
                        <input type="number" id="breakHours" min="0" max="24" value="0">
                        <span class="small-label">Hours</span>
                    </div>
                    <div class="flex-item">
                        <input type="number" id="breakMins" min="0" max="59" value="0">
                        <span class="small-label">Minutes</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Total Hours</label>
                <input type="text" id="totalHours" readonly placeholder="0h 0m">
            </div>

            <div class="form-group">
                <label>Start KM *</label>
                <input type="number" id="startKm" required>
            </div>

            <div class="form-group">
                <label>End KM *</label>
                <input type="number" id="endKm" required>
            </div>

            <div class="form-group">
                <label>Total KM</label>
                <input type="number" id="totalKm" readonly placeholder="0">
            </div>

            <div class="form-group">
                <label>Remarks</label>
                <input type="text" id="remarks" placeholder="Any notes...">
            </div>

            <button type="submit">Submit Log</button>
        </form>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyg31dt5IlZRN90ns_6VF4xFe-EYetWTYKRyPAeTiryrGn6y5cfzO1aZYv1WSx9WM2tvA/exec'; 

        function calculateKm() {
            const start = parseFloat(document.getElementById('startKm').value) || 0;
            const end = parseFloat(document.getElementById('endKm').value) || 0;
            if(end > start) {
                document.getElementById('totalKm').value = end - start;
            } else {
                document.getElementById('totalKm').value = "";
            }
        }
        document.getElementById('startKm').addEventListener('input', calculateKm);
        document.getElementById('endKm').addEventListener('input', calculateKm);

        function calculateHours() {
            const begin = document.getElementById('beginTime').value;
            const end = document.getElementById('eindTime').value;
            const bHours = parseInt(document.getElementById('breakHours').value) || 0;
            const bMins = parseInt(document.getElementById('breakMins').value) || 0;

            if(begin && end) {
                const beginDate = new Date(begin);
                const endDate = new Date(end);
                let diffMs = endDate - beginDate;

                if (diffMs > 0) {
                    const breakMs = ((bHours * 60) + bMins) * 60000;
                    diffMs -= breakMs;

                    if (diffMs > 0) {
                        const totalMins = Math.floor(diffMs / 60000);
                        const h = Math.floor(totalMins / 60);
                        const m = totalMins % 60;
                        document.getElementById('totalHours').value = h + "h " + m + "m";
                    } else {
                        document.getElementById('totalHours').value = "0h 0m";
                    }
                }
            }
        }
        
        document.getElementById('beginTime').addEventListener('input', calculateHours);
        document.getElementById('eindTime').addEventListener('input', calculateHours);
        document.getElementById('breakHours').addEventListener('input', calculateHours);
        document.getElementById('breakMins').addEventListener('input', calculateHours);

        document.getElementById('date').addEventListener('change', function(e) {
            if(!e.target.value) return;
            const date = new Date(e.target.value);
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
            document.getElementById('weekNumber').value = weekNo;
        });

        document.getElementById('truckingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const bH = parseInt(document.getElementById('breakHours').value) || 0;
            const bM = parseInt(document.getElementById('breakMins').value) || 0;
            const formattedBreakTime = String(bH).padStart(2, '0') + ':' + String(bM).padStart(2, '0');

            const payload = {
                weekNumber: document.getElementById('weekNumber').value,
                datum: document.getElementById('date').value,
                driver: document.getElementById('driver').value,
                client: document.getElementById('client').value,
                truckLicense: document.getElementById('truckLicense').value,
                trailerLicense: document.getElementById('trailerLicense').value,
                beginTime: document.getElementById('beginTime').value,
                eindTime: document.getElementById('eindTime').value,
                breakTime: formattedBreakTime,
                totalHours: document.getElementById('totalHours').value,
                startKm: document.getElementById('startKm').value,
                endKm: document.getElementById('endKm').value,
                totalKm: document.getElementById('totalKm').value,
                remarks: document.getElementById('remarks').value
            };

            const submitBtn = document.querySelector('button[type="submit"]');
            submitBtn.innerText = "Submitting...";
            submitBtn.style.backgroundColor = "#6c757d";

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('Shift logged successfully! Downloading your receipt.');
                    
                    // Generate and download the receipt
                    let receiptContent = "DRIVER SHIFT RECEIPT\n";
                    receiptContent += "------------------------\n";
                    receiptContent += "Date: " + payload.datum + "\n";
                    receiptContent += "Driver: " + payload.driver + "\n";
                    receiptContent += "Client: " + payload.client + "\n";
                    receiptContent += "Truck: " + payload.truckLicense + "\n";
                    receiptContent += "Trailer: " + payload.trailerLicense + "\n";
                    receiptContent += "Start Time: " + payload.beginTime.replace('T', ' ') + "\n";
                    receiptContent += "End Time: " + payload.eindTime.replace('T', ' ') + "\n";
                    receiptContent += "Break Time: " + payload.breakTime + "\n";
                    receiptContent += "Total Hours: " + payload.totalHours + "\n";
                    receiptContent += "Start KM: " + payload.startKm + "\n";
                    receiptContent += "End KM: " + payload.endKm + "\n";
                    receiptContent += "Total KM: " + payload.totalKm + "\n";
                    receiptContent += "Remarks: " + payload.remarks + "\n";
                    receiptContent += "------------------------\n";
                    receiptContent += "Submitted to Server successfully.";

                    const blob = new Blob([receiptContent], { type: 'text/plain' });
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(blob);
                    
                    // Name the file dynamically based on the date and driver
                    link.download = "Shift_Log_" + payload.datum + ".txt";
                    
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);

                    // Reset the form
                    document.getElementById('truckingForm').reset();
                    document.getElementById('totalHours').value = "";
                    document.getElementById('totalKm').value = "";
                    document.getElementById('breakHours').value = "0";
                    document.getElementById('breakMins').value = "0";
                }
                submitBtn.innerText = "Submit Log";
                submitBtn.style.backgroundColor = "#28a745";
            })
            .catch(error => {
                alert('Error logging shift. Check your internet connection.');
                submitBtn.innerText = "Submit Log";
                submitBtn.style.backgroundColor = "#28a745";
            });
        });
    </script>
</body>
</html>
