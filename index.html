            currentLang = lang;

        function calculateKm() {
            const start = parseFloat(document.getElementById('startKm').value)||0;
            const end = parseFloat(document.getElementById('endKm').value)||0;
            document.getElementById('totalKm').value = end > start ? end - start : "";
        }
        document.getElementById('startKm').addEventListener('input', calculateKm);
        document.getElementById('endKm').addEventListener('input', calculateKm);
        function calculateHours() {
            const begin = document.getElementById('beginTime').value;
            const end = document.getElementById('eindTime').value;
            const bHours = parseInt(document.getElementById('breakHours').value)||0;
            const bMins = parseInt(document.getElementById('breakMins').value)||0;
            if (begin && end) {
                let diffMs = new Date(end) - new Date(begin);
                if (diffMs > 0) {
                    diffMs -= ((bHours*60)+bMins)*60000;
                    if (diffMs > 0) {
                        const totalMins = Math.floor(diffMs/60000);
                        document.getElementById('totalHours').value = Math.floor(totalMins/60)+"h "+(totalMins%60)+"m";
                    } else { document.getElementById('totalHours').value = "0h 0m"; }
                }
            }
        }
        document.getElementById('beginTime').addEventListener('input', calculateHours);
        document.getElementById('eindTime').addEventListener('input', calculateHours);
        document.getElementById('breakHours').addEventListener('input', calculateHours);
        document.getElementById('breakMins').addEventListener('input', calculateHours);
        document.getElementById('date').addEventListener('change', function(e) {
            if (!e.target.value) return;
            const date = new Date(e.target.value);
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay()||7;
            d.setUTCDate(d.getUTCDate()+4-dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            document.getElementById('weekNumber').value = Math.ceil((((d-yearStart)/86400000)+1)/7);
        });
        function generateCurrentPayload() {
            const bH = parseInt(document.getElementById('breakHours').value)||0;
            const bM = parseInt(document.getElementById('breakMins').value)||0;
            return { weekNumber:document.getElementById('weekNumber').value, datum:document.getElementById('date').value, driver:document.getElementById('driver').value, client:document.getElementById('client').value, truckLicense:document.getElementById('truckLicense').value, trailerLicense:document.getElementById('trailerLicense').value, beginTime:document.getElementById('beginTime').value, eindTime:document.getElementById('eindTime').value, breakTime:bH+"h "+bM+"m", totalHours:document.getElementById('totalHours').value, startKm:document.getElementById('startKm').value, endKm:document.getElementById('endKm').value, totalKm:document.getElementById('totalKm').value, remarks:document.getElementById('remarks').value };
        }
        function generatePDF(payload) {
            const l = dictionary[currentLang];
            if (!payload||!payload.driver) { alert(l.alert_fill); return; }
            const {jsPDF} = window.jspdf;
            const doc = new jsPDF();
            doc.setFontSize(18); doc.setFont("helvetica","bold"); doc.setTextColor(44,62,80);
            doc.text("DN Flex - "+l.pdf_title, 15, 20);
            const startX=15; let currentY=28; const tableWidth=180; const col1Width=55; const rowHeight=9;
            doc.setFillColor(51,122,183); doc.rect(startX,currentY,tableWidth,rowHeight,"F");
            doc.setFontSize(11); doc.setFont("helvetica","bold"); doc.setTextColor(255,255,255);
            doc.text(l.pdf_field, startX+4, currentY+6); doc.text(l.pdf_value, startX+col1Width+4, currentY+6);
            currentY += rowHeight;
            const reportRows = [[l.driver.replace(' *',''),payload.driver],[l.client.replace(' *',''),payload.client],[l.truck,payload.truckLicense||"-"],[l.trailer,payload.trailerLicense||"-"],[l.startTime.replace(' *',''),payload.beginTime.replace('T',' ')],[l.endTime.replace(' *',''),payload.eindTime.replace('T',' ')],[l.breakTime,payload.breakTime],[l.startKm.replace(' *',''),payload.startKm],[l.endKm.replace(' *',''),payload.endKm],[l.totalKm,payload.totalKm],[l.totalHours,payload.totalHours],[l.remarks,payload.remarks||"-"]];
            reportRows.forEach((row,index) => {
                doc.setFillColor(index%2===0?245:255, index%2===0?247:255, index%2===0?250:255);
                doc.rect(startX,currentY,tableWidth,rowHeight,"F"); doc.setDrawColor(220,224,230); doc.rect(startX,currentY,tableWidth,rowHeight,"D");
                doc.setTextColor(60,60,60); doc.setFont("helvetica","normal");
                doc.text(row[0], startX+4, currentY+6); doc.text(String(row[1]), startX+col1Width+4, currentY+6);
                currentY += rowHeight;
            });
            const fileName = "DN_Flex_Log_"+payload.datum+".pdf";
            const pdfBlob = doc.output('blob');
            const pdfFile = new File([pdfBlob], fileName, {type:'application/pdf'});
            if (navigator.canShare && navigator.canShare({files:[pdfFile]})) {
                navigator.share({files:[pdfFile],title:fileName}).catch(e=>console.log(e));
            } else { doc.save(fileName); }
        }
        function generateExcel(payload) {
            const l = dictionary[currentLang];
            if (!payload||!payload.driver) { alert(l.alert_fill); return; }
            const dataRows = [[l.pdf_field,l.pdf_value],[l.week,payload.weekNumber],[l.date.replace(' *',''),payload.datum],[l.driver.replace(' *',''),payload.driver],[l.client.replace(' *',''),payload.client],[l.truck,payload.truckLicense||"-"],[l.trailer,payload.trailerLicense||"-"],[l.startTime.replace(' *',''),payload.beginTime.replace('T',' ')],[l.endTime.replace(' *',''),payload.eindTime.replace('T',' ')],[l.breakTime,payload.breakTime],[l.totalHours,payload.totalHours],[l.startKm.replace(' *',''),payload.startKm],[l.endKm.replace(' *',''),payload.endKm],[l.totalKm,payload.totalKm],[l.remarks,payload.remarks||"-"]];
            const worksheet = XLSX.utils.aoa_to_sheet(dataRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "DN Flex Log");
            const fileName = "DN_Flex_Log_"+payload.datum+".xlsx";
            const excelBuffer = XLSX.write(workbook,{bookType:'xlsx',type:'array'});
            const excelBlob = new Blob([excelBuffer],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
            const excelFile = new File([excelBlob], fileName, {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
            if (navigator.canShare && navigator.canShare({files:[excelFile]})) {
                navigator.share({files:[excelFile],title:fileName}).catch(e=>console.log(e));
            } else { XLSX.writeFile(workbook, fileName); }
        }
        function sendWhatsApp(payload) {
            const l = dictionary[currentLang];
            if (!payload||!payload.driver) { alert(l.alert_fill); return; }
            let msg = "DN FLEX DRIVER REPORT\n------------------------\n";
            msg += l.date.replace(' *','')+": "+payload.datum+"\n";
            msg += l.driver.replace(' *','')+": "+payload.driver+"\n";
            msg += l.client.replace(' *','')+": "+payload.client+"\n";
            msg += l.truck+": "+(payload.truckLicense||"-")+"\n";
            msg += l.trailer+": "+(payload.trailerLicense||"-")+"\n";
            msg += l.startTime.replace(' *','')+": "+payload.beginTime.replace('T',' ')+"\n";
            msg += l.endTime.replace(' *','')+": "+payload.eindTime.replace('T',' ')+"\n";
            msg += l.breakTime+": "+payload.breakTime+"\n";
            msg += l.totalHours+": "+payload.totalHours+"\n";
            msg += l.startKm.replace(' *','')+": "+payload.startKm+"\n";
            msg += l.endKm.replace(' *','')+": "+payload.endKm+"\n";
            msg += l.totalKm+": "+payload.totalKm+"\n";
            msg += l.remarks+": "+(payload.remarks||"-");
            window.location.href = "https://api.whatsapp.com/send?text="+encodeURIComponent(msg);
        }
        document.getElementById('whatsappBtn').addEventListener('click', ()=>{ sendWhatsApp(lastSubmittedPayload||generateCurrentPayload()); });
        document.getElementById('pdfBtn').addEventListener('click', ()=>{ generatePDF(lastSubmittedPayload||generateCurrentPayload()); });
        document.getElementById('excelBtn').addEventListener('click', ()=>{ generateExcel(lastSubmittedPayload||generateCurrentPayload()); });
        document.getElementById('truckingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const payload = generateCurrentPayload();
            lastSubmittedPayload = payload;
            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = dictionary[currentLang].submitting;
            submitBtn.style.backgroundColor = "#6c757d";
            fetch(GOOGLE_SCRIPT_URL, {method:'POST', body:JSON.stringify(payload)})
            .then(r=>r.json())
            .then(data=>{ if(data.status==='success') alert(dictionary[currentLang].success); submitBtn.innerText=dictionary[currentLang].submit; submitBtn.style.backgroundColor="#28a745"; })
            .catch(()=>{ alert(dictionary[currentLang].error); submitBtn.innerText=dictionary[currentLang].submit; submitBtn.style.backgroundColor="#28a745"; });
        });
    </script>
</body>
</html>
