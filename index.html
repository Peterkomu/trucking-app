        body {

            min-height: 100vh; 
        }

        .form-container { 
            background: rgba(255, 255, 255, 0.95); 
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 30px; 
            border-radius: 16px; 
            box-shadow: 0 18px 40px rgba(0,0,0,0.28); 
            border-top: 6px solid #337ab7; 
        }
        
        .header-brand { 
            text-align: center; 
            margin-bottom: 25px; 
        }

        .header-brand h1 { 
            font-family: 'Playfair Display', serif; 
            color: #000000; 
            margin: 0 0 6px 0; 
            font-size: 40px; 
            letter-spacing: 0.5px; 
            text-transform: none; 
            font-weight: 800; 
        }

        .header-brand h1 span { 
            color: #000000; 
        }

        .header-brand h3 { 
            color: #5b6777; 
            margin: 0; 
            font-size: 14px; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 1.4px;
        }

        .form-group { 
            margin-bottom: 18px; 
        }

        label { 
            display: block; 
            margin-bottom: 6px; 
            font-weight: 700; 
            color: #243447; 
            font-size: 14px;
        }

        input, select { 
            width: 100%; 
            padding: 12px; 
            box-sizing: border-box; 
            border: 1px solid #cbd5e1; 
            border-radius: 8px; 
            font-size: 15px; 
            background-color: #f8fafc; 
            transition: border-color 0.3s, box-shadow 0.3s, background-color 0.3s;
            font-family: 'Manrope', sans-serif;
        }

        input:focus, select:focus { 
            outline: none; 
            border-color: #337ab7; 
            box-shadow: 0 0 0 3px rgba(51,122,183,.15); 
            background-color: #fff; 
        }

        input[readonly] { 
            background-color: #e2e8f0; 
            cursor: not-allowed; 
            color: #475569; 
            font-weight: 700;
        }
        
        .lang-container { 
            display: flex; 
            flex-wrap: wrap; 
            gap: 8px; 
            justify-content: center; 
            margin-bottom: 25px; 
            padding-bottom: 15px; 
            border-bottom: 1px solid #f1f5f9;
        }

        .btn-lang { 
            background-color: #f1f5f9; 
            color: #475569; 
            padding: 8px 14px; 
            font-size: 13px; 
            font-weight: 700; 
            border-radius: 20px; 
            width: auto; 
            margin-top: 0; 
            display: inline-block; 
            cursor: pointer; 
            border: 1px solid #e2e8f0; 
            transition: all 0.2s;
            font-family: 'Manrope', sans-serif;
        }

        .btn-lang.active { 
            background-color: #337ab7; 
            color: white; 
            border-color: #2e6da4; 
            box-shadow: 0 2px 4px rgba(51,122,183,0.3); 
        }
        
        button { 
            width: 100%; 
            padding: 14px; 
            border: none; 
            font-size: 16px; 
            font-weight: 700; 
            border-radius: 10px; 
            cursor: pointer; 
            margin-top: 12px; 
            display: block; 
            transition: transform 0.1s, box-shadow 0.2s; 
            font-family: 'Manrope', sans-serif;
        }

            transform: scale(0.98); 
        }

            color: white; 
            box-shadow: 0 4px 6px rgba(40,167,69,0.2);

            background-color: #218838; 
            box-shadow: 0 6px 10px rgba(40,167,69,0.3); 
        }

            color: white; 
            box-shadow: 0 4px 6px rgba(37,211,102,0.2);

        .btn-whatsapp:hover {

        </div>

        <div class="header-brand">
            <h1>DN <span>Flex</span></h1>
            <h3 id="ui-title">Driver Work Entry</h3>
        </div>
        
        <form id="truckingForm">
            <div class="form-group">
                <label id="ui-date">Date *</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label id="ui-week">Week Number</label>
                <input type="number" id="weekNumber" required readonly>
            </div>

            <div class="form-group">
                <label id="ui-driver">Driver Name *</label>
                <input type="text" id="driver" required placeholder="Type your name...">
            </div>

            <div class="form-group">
                <label id="ui-client">Client Name *</label>
                <input type="text" id="client" required placeholder="Type client name...">
            </div>

            <div class="form-group">
                <label id="ui-truck">Truck License</label>
                <input type="text" id="truckLicense" placeholder="e.g. 75-BLT-6">
            </div>

            <div class="form-group">
                <label id="ui-trailer">Trailer License</label>
                <input type="text" id="trailerLicense" placeholder="e.g. ON-29-FH">
            </div>

            <div class="form-group">
                <label id="ui-start-time">Start Time *</label>
                <input type="datetime-local" id="beginTime" required>
            </div>

            <div class="form-group">
                <label id="ui-end-time">End Time *</label>
                <input type="datetime-local" id="eindTime" required>
            </div>

            <div class="form-group">
                <label id="ui-break-time">Break Time</label>
                <div class="flex-row">
                    <div class="flex-item">
                        <input type="number" id="breakHours" min="0" max="24" value="0">
                        <span class="small-label" id="ui-hours">Hours</span>
                    </div>
                    <div class="flex-item">
                        <input type="number" id="breakMins" min="0" max="59" value="0">
                        <span class="small-label" id="ui-minutes">Minutes</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label id="ui-total-hours">Total Hours</label>
                <input type="text" id="totalHours" readonly placeholder="0h 0m">
            </div>

            <div class="form-group">
                <label id="ui-start-km">Start KM *</label>
                <input type="number" id="startKm" required>
            </div>

            <div class="form-group">
                <label id="ui-end-km">End KM *</label>
                <input type="number" id="endKm" required>
            </div>

            <div class="form-group">
                <label id="ui-total-km">Total KM</label>
                <input type="number" id="totalKm" readonly placeholder="0">
            </div>

            <div class="form-group">
                <label id="ui-remarks">Remarks</label>
                <input type="text" id="remarks" placeholder="Any notes...">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Log</button>
        </form>

        <div class="extra-actions">
            <button type="button" class="btn-whatsapp" id="whatsappBtn">Send via WhatsApp</button>
            <button type="button" class="btn-pdf" id="pdfBtn">Download PDF</button>
            <button type="button" class="btn-excel" id="excelBtn">Download Excel</button>
        </div>
    </div>

        function setLanguage(lang) {
            currentLang = lang;
            
            document.querySelectorAll('.btn-lang').forEach(btn => btn.classList.remove('active'));
            const indexMap = { en:0, nl:1, pl:2, pt:3, ro:4, ru:5, bg:6, fr:7, de:8 };
            document.querySelectorAll('.btn-lang')[indexMap[lang]].classList.add('active');

            const l = dictionary[lang];
            document.getElementById('ui-title').innerText = l.title;
            document.getElementById('ui-date').innerText = l.date;
            document.getElementById('ui-week').innerText = l.week;
            document.getElementById('ui-driver').innerText = l.driver;
            document.getElementById('ui-client').innerText = l.client;
            document.getElementById('ui-truck').innerText = l.truck;
            document.getElementById('ui-trailer').innerText = l.trailer;
            document.getElementById('ui-start-time').innerText = l.startTime;
            document.getElementById('ui-end-time').innerText = l.endTime;
            document.getElementById('ui-break-time').innerText = l.breakTime;
            document.getElementById('ui-hours').innerText = l.hours;
            document.getElementById('ui-minutes').innerText = l.minutes;
            document.getElementById('ui-total-hours').innerText = l.totalHours;
            document.getElementById('ui-start-km').innerText = l.startKm;
            document.getElementById('ui-end-km').innerText = l.endKm;
            document.getElementById('ui-total-km').innerText = l.totalKm;
            document.getElementById('ui-remarks').innerText = l.remarks;

            document.getElementById('submitBtn').innerText = l.submit;
            document.getElementById('whatsappBtn').innerText = l.whatsapp;
            document.getElementById('pdfBtn').innerText = l.pdf;
            document.getElementById('excelBtn').innerText = l.excel;

            document.getElementById('driver').placeholder = l.p_driver;
            document.getElementById('client').placeholder = l.p_client;
            document.getElementById('remarks').placeholder = l.p_notes;
        }

        function calculateKm() {
            const start = parseFloat(document.getElementById('startKm').value) || 0;
            const end = parseFloat(document.getElementById('endKm').value) || 0;
            if (end > start) {
                document.getElementById('totalKm').value = end - start;
            } else {
                document.getElementById('totalKm').value = "";
            }
        }

        document.getElementById('startKm').addEventListener('input', calculateKm);
        document.getElementById('endKm').addEventListener('input', calculateKm);

        function calculateHours() {
            const begin = document.getElementById('beginTime').value;
            const end = document.getElementById('eindTime').value;
            const bHours = parseInt(document.getElementById('breakHours').value) || 0;
            const bMins = parseInt(document.getElementById('breakMins').value) || 0;

            if (begin && end) {
                const beginDate = new Date(begin);
                const endDate = new Date(end);
                let diffMs = endDate - beginDate;

                if (diffMs > 0) {
                    const breakMs = ((bHours * 60) + bMins) * 60000;
                    diffMs -= breakMs;

                    if (diffMs > 0) {
                        const totalMins = Math.floor(diffMs / 60000);
                        const h = Math.floor(totalMins / 60);
                        const m = totalMins % 60;
                        document.getElementById('totalHours').value = h + "h " + m + "m";
                    } else {
                        document.getElementById('totalHours').value = "0h 0m";
                    }
                }
            }
        }
        
        document.getElementById('beginTime').addEventListener('input', calculateHours);
        document.getElementById('eindTime').addEventListener('input', calculateHours);
        document.getElementById('breakHours').addEventListener('input', calculateHours);
        document.getElementById('breakMins').addEventListener('input', calculateHours);

        document.getElementById('date').addEventListener('change', function(e) {
            if (!e.target.value) return;
            const date = new Date(e.target.value);
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(), 0, 1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1) / 7);
            document.getElementById('weekNumber').value = weekNo;
        });

        function generateCurrentPayload() {
            const bH = parseInt(document.getElementById('breakHours').value) || 0;
            const bM = parseInt(document.getElementById('breakMins').value) || 0;
            return {
                weekNumber: document.getElementById('weekNumber').value,
                datum: document.getElementById('date').value,
                driver: document.getElementById('driver').value,
                client: document.getElementById('client').value,
                truckLicense: document.getElementById('truckLicense').value,
                trailerLicense: document.getElementById('trailerLicense').value,
                beginTime: document.getElementById('beginTime').value,
                eindTime: document.getElementById('eindTime').value,
                breakTime: bH + "h " + bM + "m",
                totalHours: document.getElementById('totalHours').value,
                startKm: document.getElementById('startKm').value,
                endKm: document.getElementById('endKm').value,
                totalKm: document.getElementById('totalKm').value,
                remarks: document.getElementById('remarks').value
            };
        }

        function generatePDF(payload) {
            const l = dictionary[currentLang];
            if (!payload || !payload.driver) {
                alert(l.alert_fill);
                return;
            }

            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(44, 62, 80);
            doc.text("DN Flex - " + l.pdf_title, 15, 20);
            
            const startX = 15;
            let currentY = 28;
            const tableWidth = 180;
            const col1Width = 55;
            const rowHeight = 9;
            
            doc.setFillColor(51, 122, 183); 
            doc.rect(startX, currentY, tableWidth, rowHeight, "F");
            
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(255, 255, 255);
            doc.text(l.pdf_field, startX + 4, currentY + 6);
            doc.text(l.pdf_value, startX + col1Width + 4, currentY + 6);
            
            currentY += rowHeight;
            
            const reportRows = [
                [l.driver.replace(' *',''), payload.driver],
                [l.client.replace(' *',''), payload.client],
                [l.truck, payload.truckLicense || "-"],
                [l.trailer, payload.trailerLicense || "-"],
                [l.startTime.replace(' *',''), payload.beginTime.replace('T', ' ')],
                [l.endTime.replace(' *',''), payload.eindTime.replace('T', ' ')],
                [l.breakTime, payload.breakTime],
                [l.startKm.replace(' *',''), payload.startKm],
                [l.endKm.replace(' *',''), payload.endKm],
                [l.totalKm, payload.totalKm],
                [l.totalHours, payload.totalHours],
                [l.remarks, payload.remarks || "-"]
            ];
            
            reportRows.forEach((row, index) => {
                doc.setFillColor(index % 2 === 0 ? 245 : 255, index % 2 === 0 ? 247 : 255, index % 2 === 0 ? 250 : 255);
                doc.rect(startX, currentY, tableWidth, rowHeight, "F");
                doc.setDrawColor(220, 224, 230);
                doc.rect(startX, currentY, tableWidth, rowHeight, "D");
                
                doc.setTextColor(60, 60, 60);
                doc.setFont("helvetica", "normal");
                doc.text(row[0], startX + 4, currentY + 6);
                doc.text(String(row[1]), startX + col1Width + 4, currentY + 6);
                
                currentY += rowHeight;
            });
            
            const fileName = "DN_Flex_Log_" + payload.datum + ".pdf";
            const pdfBlob = doc.output('blob');
            const pdfFile = new File([pdfBlob], fileName, { type: 'application/pdf' });

            if (navigator.canShare && navigator.canShare({ files: [pdfFile] })) {
                navigator.share({
                    files: [pdfFile],
                    title: fileName
                }).catch(e => console.log('Share canceled or failed', e));
            } else {
                doc.save(fileName);
            }
        }

        function generateExcel(payload) {
            const l = dictionary[currentLang];
            if (!payload || !payload.driver) {
                alert(l.alert_fill);
                return;
            }
            
            const dataRows = [
                [l.pdf_field, l.pdf_value],
                [l.week, payload.weekNumber],
                [l.date.replace(' *',''), payload.datum],
                [l.driver.replace(' *',''), payload.driver],
                [l.client.replace(' *',''), payload.client],
                [l.truck, payload.truckLicense || "-"],
                [l.trailer, payload.trailerLicense || "-"],
                [l.startTime.replace(' *',''), payload.beginTime.replace('T', ' ')],
                [l.endTime.replace(' *',''), payload.eindTime.replace('T', ' ')],
                [l.breakTime, payload.breakTime],
                [l.totalHours, payload.totalHours],
                [l.startKm.replace(' *',''), payload.startKm],
                [l.endKm.replace(' *',''), payload.endKm],
                [l.totalKm, payload.totalKm],
                [l.remarks, payload.remarks || "-"]
            ];

            const worksheet = XLSX.utils.aoa_to_sheet(dataRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, "DN Flex Log");
            
            const fileName = "DN_Flex_Log_" + payload.datum + ".xlsx";
            const excelBuffer = XLSX.write(workbook, { bookType: 'xlsx', type: 'array' });
            const excelBlob = new Blob([excelBuffer], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
            const excelFile = new File([excelBlob], fileName, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });

            if (navigator.canShare && navigator.canShare({ files: [excelFile] })) {
                navigator.share({
                    files: [excelFile],
                    title: fileName
                }).catch(e => console.log('Share canceled or failed', e));
            } else {
                XLSX.writeFile(workbook, fileName);
            }
        }

        function sendWhatsApp(payload) {
            const l = dictionary[currentLang];
            if (!payload || !payload.driver) {
                alert(l.alert_fill);
                return;
            }

            let msg = "DN FLEX DRIVER REPORT\n";
            msg += "------------------------\n";
            msg += l.date.replace(' *','') + ": " + payload.datum + "\n";
            msg += l.driver.replace(' *','') + ": " + payload.driver + "\n";
            msg += l.client.replace(' *','') + ": " + payload.client + "\n";
            msg += l.truck + ": " + (payload.truckLicense || "-") + "\n";
            msg += l.trailer + ": " + (payload.trailerLicense || "-") + "\n";
            msg += l.startTime.replace(' *','') + ": " + payload.beginTime.replace('T', ' ') + "\n";
            msg += l.endTime.replace(' *','') + ": " + payload.eindTime.replace('T', ' ') + "\n";
            msg += l.breakTime + ": " + payload.breakTime + "\n";
            msg += l.totalHours + ": " + payload.totalHours + "\n";
            msg += l.startKm.replace(' *','') + ": " + payload.startKm + "\n";
            msg += l.endKm.replace(' *','') + ": " + payload.endKm + "\n";
            msg += l.totalKm + ": " + payload.totalKm + "\n";
            msg += l.remarks + ": " + (payload.remarks || "-");

            const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(msg);
            window.location.href = url;
        }

        document.getElementById('whatsappBtn').addEventListener('click', () => {
            const activePayload = lastSubmittedPayload || generateCurrentPayload();
            sendWhatsApp(activePayload);
        });

        document.getElementById('pdfBtn').addEventListener('click', () => {
            const activePayload = lastSubmittedPayload || generateCurrentPayload();
            generatePDF(activePayload);
        });

        document.getElementById('excelBtn').addEventListener('click', () => {
            const activePayload = lastSubmittedPayload || generateCurrentPayload();
            generateExcel(activePayload);
        });

        document.getElementById('truckingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const payload = generateCurrentPayload();
            lastSubmittedPayload = payload; 

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = dictionary[currentLang].submitting;
            submitBtn.style.backgroundColor = "#6c757d";

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if (data.status === 'success') {
                    alert(dictionary[currentLang].success);
                }
                submitBtn.innerText = dictionary[currentLang].submit;
                submitBtn.style.backgroundColor = "#28a745";
            })
            .catch(error => {
                alert(dictionary[currentLang].error);
                submitBtn.innerText = dictionary[currentLang].submit;
                submitBtn.style.backgroundColor = "#28a745";
            });
        });
    </script>
</body>
