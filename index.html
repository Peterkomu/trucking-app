<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Work Entry</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; background-color: #f4f7f6; }
        .form-container { background: white; padding: 25px; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #333; font-size: 14px;}
        input, select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; font-size: 16px;}
        input[readonly] { background-color: #e9ecef; cursor: not-allowed; color: #666; font-weight: bold;}
        
        /* Action Buttons Styling */
        button { width: 100%; padding: 14px; border: none; font-size: 16px; font-weight: bold; border-radius: 4px; cursor: pointer; margin-top: 12px; display: block;}
        .btn-submit { background-color: #28a745; color: white; }
        .btn-submit:hover { background-color: #218838; }
        .btn-whatsapp { background-color: #25D366; color: white; }
        .btn-whatsapp:hover { background-color: #1ebd56; }
        .btn-pdf { background-color: #d9534f; color: white; }
        .btn-pdf:hover { background-color: #c9302c; }
        .btn-excel { background-color: #4caf50; color: white; }
        .btn-excel:hover { background-color: #388e3c; }
        
        h2 { text-align: center; color: #2c3e50; margin-top: 0;}
        .flex-row { display: flex; gap: 10px; }
        .flex-item { flex: 1; }
        .small-label { display: block; font-size: 12px; color: #666; margin-top: 4px; text-align: center;}
        .extra-actions { margin-top: 5px; }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Driver Work Entry</h2>
        <form id="truckingForm">
            
            <div class="form-group">
                <label>Date *</label>
                <input type="date" id="date" required>
            </div>

            <div class="form-group">
                <label>Week Number</label>
                <input type="number" id="weekNumber" required readonly>
            </div>

            <div class="form-group">
                <label>Driver Name *</label>
                <input type="text" id="driver" required placeholder="Type your name...">
            </div>

            <div class="form-group">
                <label>Client Name *</label>
                <input type="text" id="client" required placeholder="Type client name...">
            </div>

            <div class="form-group">
                <label>Truck License</label>
                <input type="text" id="truckLicense" placeholder="e.g. 75-BLT-6">
            </div>

            <div class="form-group">
                <label>Trailer License</label>
                <input type="text" id="trailerLicense" placeholder="e.g. ON-29-FH">
            </div>

            <div class="form-group">
                <label>Start Time *</label>
                <input type="datetime-local" id="beginTime" required>
            </div>

            <div class="form-group">
                <label>End Time *</label>
                <input type="datetime-local" id="eindTime" required>
            </div>

            <div class="form-group">
                <label>Break Time</label>
                <div class="flex-row">
                    <div class="flex-item">
                        <input type="number" id="breakHours" min="0" max="24" value="0">
                        <span class="small-label">Hours</span>
                    </div>
                    <div class="flex-item">
                        <input type="number" id="breakMins" min="0" max="59" value="0">
                        <span class="small-label">Minutes</span>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Total Hours</label>
                <input type="text" id="totalHours" readonly placeholder="0h 0m">
            </div>

            <div class="form-group">
                <label>Start KM *</label>
                <input type="number" id="startKm" required>
            </div>

            <div class="form-group">
                <label>End KM *</label>
                <input type="number" id="endKm" required>
            </div>

            <div class="form-group">
                <label>Total KM</label>
                <input type="number" id="totalKm" readonly placeholder="0">
            </div>

            <div class="form-group">
                <label>Remarks</label>
                <input type="text" id="remarks" placeholder="Any notes...">
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Submit Log</button>
        </form>

        <div class="extra-actions">
            <button type="button" class="btn-whatsapp" id="whatsappBtn">Send via WhatsApp</button>
            <button type="button" class="btn-pdf" id="pdfBtn">Download PDF</button>
            <button type="button" class="btn-excel" id="excelBtn">Download Excel</button>
        </div>
    </div>

    <script>
        const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyg31dt5IlZRN90ns_6VF4xFe-EYetWTYKRyPAeTiryrGn6y5cfzO1aZYv1WSx9WM2tvA/exec'; 

        // Cache variable to safely preserve the last dataset for sharing after form resets
        let lastSubmittedPayload = null;

        function calculateKm() {
            const start = parseFloat(document.getElementById('startKm').value) || 0;
            const end = parseFloat(document.getElementById('endKm').value) || 0;
            if(end > start) {
                document.getElementById('totalKm').value = end - start;
            } else {
                document.getElementById('totalKm').value = "";
            }
        }
        document.getElementById('startKm').addEventListener('input', calculateKm);
        document.getElementById('endKm').addEventListener('input', calculateKm);

        function calculateHours() {
            const begin = document.getElementById('beginTime').value;
            const end = document.getElementById('eindTime').value;
            const bHours = parseInt(document.getElementById('breakHours').value) || 0;
            const bMins = parseInt(document.getElementById('breakMins').value) || 0;

            if(begin && end) {
                const beginDate = new Date(begin);
                const endDate = new Date(end);
                let diffMs = endDate - beginDate;

                if (diffMs > 0) {
                    const breakMs = ((bHours * 60) + bMins) * 60000;
                    diffMs -= breakMs;

                    if (diffMs > 0) {
                        const totalMins = Math.floor(diffMs / 60000);
                        const h = Math.floor(totalMins / 60);
                        const m = totalMins % 60;
                        document.getElementById('totalHours').value = h + "h " + m + "m";
                    } else {
                        document.getElementById('totalHours').value = "0h 0m";
                    }
                }
            }
        }
        
        document.getElementById('beginTime').addEventListener('input', calculateHours);
        document.getElementById('eindTime').addEventListener('input', calculateHours);
        document.getElementById('breakHours').addEventListener('input', calculateHours);
        document.getElementById('breakMins').addEventListener('input', calculateHours);

        document.getElementById('date').addEventListener('change', function(e) {
            if(!e.target.value) return;
            const date = new Date(e.target.value);
            const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
            const dayNum = d.getUTCDay() || 7;
            d.setUTCDate(d.getUTCDate() + 4 - dayNum);
            const yearStart = new Date(Date.UTC(d.getUTCFullYear(),0,1));
            const weekNo = Math.ceil((((d - yearStart) / 86400000) + 1)/7);
            document.getElementById('weekNumber').value = weekNo;
        });

        function generateCurrentPayload() {
            const bH = parseInt(document.getElementById('breakHours').value) || 0;
            const bM = parseInt(document.getElementById('breakMins').value) || 0;
            return {
                weekNumber: document.getElementById('weekNumber').value,
                datum: document.getElementById('date').value,
                driver: document.getElementById('driver').value,
                client: document.getElementById('client').value,
                truckLicense: document.getElementById('truckLicense').value,
                trailerLicense: document.getElementById('trailerLicense').value,
                beginTime: document.getElementById('beginTime').value,
                eindTime: document.getElementById('eindTime').value,
                breakTime: bH + "h " + bM + "m",
                totalHours: document.getElementById('totalHours').value,
                startKm: document.getElementById('startKm').value,
                endKm: document.getElementById('endKm').value,
                totalKm: document.getElementById('totalKm').value,
                remarks: document.getElementById('remarks').value
            };
        }

        // --- EXPORT FUNCTIONALITIES ---
        function generatePDF(payload) {
            if (!payload || !payload.driver) {
                alert("Please fill out and submit the log data first.");
                return;
            }
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            
            doc.setFontSize(18);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(44, 62, 80);
            doc.text("Driver Work Report", 15, 20);
            
            const startX = 15;
            let currentY = 28;
            const tableWidth = 180;
            const col1Width = 55;
            const rowHeight = 9;
            
            doc.setFillColor(51, 122, 183); 
            doc.rect(startX, currentY, tableWidth, rowHeight, "F");
            
            doc.setFontSize(11);
            doc.setFont("helvetica", "bold");
            doc.setTextColor(255, 255, 255);
            doc.text("Field", startX + 4, currentY + 6);
            doc.text("Value", startX + col1Width + 4, currentY + 6);
            
            currentY += rowHeight;
            
            const reportRows = [
                ["Driver", payload.driver],
                ["Client", payload.client],
                ["Truck", payload.truckLicense || "-"],
                ["Trailer", payload.trailerLicense || "-"],
                ["Start Time", payload.beginTime.replace('T', ' ')],
                ["End Time", payload.eindTime.replace('T', ' ')],
                ["Break Time", payload.breakTime],
                ["Start KM", payload.startKm],
                ["End KM", payload.endKm],
                ["Total KM", payload.totalKm],
                ["Total Hours", payload.totalHours],
                ["Remarks", payload.remarks || "-"]
            ];
            
            reportRows.forEach((row, index) => {
                if (index % 2 === 0) {
                    doc.setFillColor(245, 247, 250);
                } else {
                    doc.setFillColor(255, 255, 255);
                }
                doc.rect(startX, currentY, tableWidth, rowHeight, "F");
                
                doc.setDrawColor(220, 224, 230);
                doc.rect(startX, currentY, tableWidth, rowHeight, "D");
                
                doc.setTextColor(60, 60, 60);
                doc.setFont("helvetica", "normal");
                doc.text(row[0], startX + 4, currentY + 6);
                doc.text(String(row[1]), startX + col1Width + 4, currentY + 6);
                
                currentY += rowHeight;
            });
            
            doc.save("Shift_Log_" + payload.datum + ".pdf");
        }

        function generateExcel(payload) {
            if (!payload || !payload.driver) {
                alert("Please fill out and submit the log data first.");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Field,Value\n";
            csvContent += "Week Number," + payload.weekNumber + "\n";
            csvContent += "Date," + payload.datum + "\n";
            csvContent += "Driver," + payload.driver + "\n";
            csvContent += "Client," + payload.client + "\n";
            csvContent += "Truck License," + (payload.truckLicense || "-") + "\n";
            csvContent += "Trailer License," + (payload.trailerLicense || "-") + "\n";
            csvContent += "Start Time," + payload.beginTime.replace('T', ' ') + "\n";
            csvContent += "End Time," + payload.eindTime.replace('T', ' ') + "\n";
            csvContent += "Break Time," + payload.breakTime + "\n";
            csvContent += "Total Hours," + payload.totalHours + "\n";
            csvContent += "Start KM," + payload.startKm + "\n";
            csvContent += "End KM," + payload.endKm + "\n";
            csvContent += "Total KM," + payload.totalKm + "\n";
            csvContent += "Remarks," + (payload.remarks || "-") + "\n";

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", "Shift_Log_" + payload.datum + ".csv");
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        function sendWhatsApp(payload) {
            if (!payload || !payload.driver) {
                alert("Please fill out and submit the log data first.");
                return;
            }
            let msg = "DRIVER SHIFT REPORT\n";
            msg += "------------------------\n";
            msg += "Date: " + payload.datum + "\n";
            msg += "Driver: " + payload.driver + "\n";
            msg += "Client: " + payload.client + "\n";
            msg += "Truck: " + (payload.truckLicense || "-") + "\n";
            msg += "Trailer: " + (payload.trailerLicense || "-") + "\n";
            msg += "Start Time: " + payload.beginTime.replace('T', ' ') + "\n";
            msg += "End Time: " + payload.eindTime.replace('T', ' ') + "\n";
            msg += "Break Time: " + payload.breakTime + "\n";
            msg += "Total Hours: " + payload.totalHours + "\n";
            msg += "Start KM: " + payload.startKm + "\n";
            msg += "End KM: " + payload.endKm + "\n";
            msg += "Total KM: " + payload.totalKm + "\n";
            msg += "Remarks: " + (payload.remarks || "-");

            const url = "https://api.whatsapp.com/send?text=" + encodeURIComponent(msg);
            window.open(url, '_blank');
        }

        // --- BUTTON EVENT LISTENERS ---
        document.getElementById('whatsappBtn').addEventListener('click', () => {
            const activePayload = lastSubmittedPayload || generateCurrentPayload();
            sendWhatsApp(activePayload);
        });

        document.getElementById('pdfBtn').addEventListener('click', () => {
            const activePayload = lastSubmittedPayload || generateCurrentPayload();
            generatePDF(activePayload);
        });

        document.getElementById('excelBtn').addEventListener('click', () => {
            const activePayload = lastSubmittedPayload || generateCurrentPayload();
            generateExcel(activePayload);
        });

        // --- MAIN FORM SUBMISSION PIPELINE ---
        document.getElementById('truckingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const payload = generateCurrentPayload();
            lastSubmittedPayload = payload; // Lock current data into memory block

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.innerText = "Submitting...";
            submitBtn.style.backgroundColor = "#6c757d";

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('Shift logged successfully! You can now use the optional sharing choices below.');
                    
                    // Clear out inputs safely on screen
                    document.getElementById('truckingForm').reset();
                    document.getElementById('totalHours').value = "";
                    document.getElementById('totalKm').value = "";
                    document.getElementById('breakHours').value = "0";
                    document.getElementById('breakMins').value = "0";
                }
                submitBtn.innerText = "Submit Log";
                submitBtn.style.backgroundColor = "#28a745";
            })
            .catch(error => {
                alert('Error logging shift. Check your internet connection.');
                submitBtn.innerText = "Submit Log";
                submitBtn.style.backgroundColor = "#28a745";
            });
        });
    </script>
</body>
</html>
