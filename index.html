        function sendWhatsApp(payload) { const l = dictionary[currentLang]; if (!payload || !payload.driver) { alert(l.alert_fill); return; } let msg = "DN FLEX DRIVER REPORT\n------------------------\n" + l.date.replace(' *','') + ": " + payload.datum + "\n" + l.driver.replace(' *','') + ": " + payload.driver + "\n" + l.client.replace(' *','') + ": " + payload.client + "\n" + l.truck + ": " + (payload.truckLicense || "-") + "\n" + l.trailer + ": " + (payload.trailerLicense || "-") + "\n" + l.startTime.replace(' *','') + ": " + payload.beginTime.replace('T', ' ') + "\n" + l.endTime.replace(' *','') + ": " + payload.eindTime.replace('T', ' ') + "\n" + l.breakTime + ": " + payload.breakTime + "\n" + l.totalHours + ": " + payload.totalHours + "\n" + l.startKm.replace(' *','') + ": " + payload.startKm + "\n" + l.endKm.replace(' *','') + ": " + payload.endKm + "\n" + l.totalKm + ": " + payload.totalKm + "\n" + l.remarks + ": " + (payload.remarks || "-"); window.location.href = "https://api.whatsapp.com/send?text=" + encodeURIComponent(msg); }

        document.getElementById('truckingForm').addEventListener('submit', function(e) { e.preventDefault(); const payload = generateCurrentPayload(); lastSubmittedPayload = payload; const submitBtn = document.getElementById('submitBtn'); submitBtn.innerText = dictionary[currentLang].submitting; submitBtn.style.backgroundColor = "#6c757d"; fetch(GOOGLE_SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) }).then(response => response.json()).then(data => { if(data.status === 'success') alert(dictionary[currentLang].success); submitBtn.innerText = dictionary[currentLang].submit; submitBtn.style.backgroundColor = "#28a745"; }).catch(error => { alert(dictionary[currentLang].error); submitBtn.innerText = dictionary[currentLang].submit; submitBtn.style.backgroundColor = "#28a745"; }); });
