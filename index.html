<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Driver Work Entry</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 500px; margin: auto; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; }
        input, select { width: 100%; padding: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Driver Work Entry</h2>
    
    <form id="truckingForm">
        <div class="form-group">
            <label>Datum</label>
            <input type="date" id="datum" required>
        </div>
        
        <div class="form-group">
            <label>Driver</label>
            <select id="driver" required>
                <option value="">Select Driver</option>
                <option value="Adrian">Adrian</option>
                <option value="Cosmin">Cosmin</option>
                <option value="Andressa">Andressa</option>
            </select>
        </div>

        <div class="form-group">
            <label>Start KM</label>
            <input type="number" id="startKm" required>
        </div>

        <div class="form-group">
            <label>End KM</label>
            <input type="number" id="endKm" required>
        </div>

        <button type="submit">Submit Log</button>
    </form>

    <script>
        // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE
        const GOOGLE_SCRIPT_URL = 'YOUR_WEB_APP_URL_HERE';

        document.getElementById('truckingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const payload = {
                datum: document.getElementById('datum').value,
                driver: document.getElementById('driver').value,
                startKm: document.getElementById('startKm').value,
                endKm: document.getElementById('endKm').value
                // Add the rest of your fields here to match the form
            };

            fetch(GOOGLE_SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                if(data.status === 'success') {
                    alert('Shift logged successfully!');
                    document.getElementById('truckingForm').reset();
                }
            })
            .catch(error => alert('Error logging shift.'));
        });
    </script>
</body>
</html>
